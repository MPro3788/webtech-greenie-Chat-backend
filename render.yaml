databases:
  - name: webtech-Greenie-Chat-Data
    databaseName: webtech_greenie_chat_data_4895
    plan: free
    region: frankfurt

services:
  - type: web
    name: webtech-greenie-Chat-backend
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webtech-Greenie-Chat-Data
          property: connectionString
      - key: PORT
        value: "10000"
